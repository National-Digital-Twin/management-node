spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:mn_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: false
        format_sql: false
server:
  port: 0
logging:
  level:
    root: WARN
    uk.gov.dbt.ndtp.ia.node.management: INFO
